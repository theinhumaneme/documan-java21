cloudflare:
  r2:
    endpoint: <-R2 ENDPOINT->
    access-key-id: <-ACCESS KEY->
    secret-access-key: <-SECRET ACCESS KEY->
    files-bucket: <-BUCKET NAME->
    files-bucket-public-access-url: <-BUCKET PUBLIC ACCESS URL->
    user-bucket: <-BUCKET NAME->
    # R2 does not implement S3 ACLs; set false when the bucket is exposed via a public dev URL or
    # a custom domain instead of a canned ACL.
    public-read-acl: true

spring:
  devtools:
    add-properties: false

  jpa:
    database: postgresql
    show-sql: true # remove in staging and production profiles

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: root
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      # With virtual threads the pool, not the servlet container, is the concurrency limit for
      # database work. 50 is well above what a single instance needs against one Postgres; keep it
      # in step with the server's max_connections when scaling out.
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
      # Was 2000ms, which flags any query slower than two seconds as a suspected leak and produces
      # a stack trace per occurrence. 30s still catches genuine leaks without the noise.
      leak-detection-threshold: 30000
      auto-commit: false
      pool-name: HikariPool

  data:
    redis:
      host: localhost
      port: 6379
      password: password
      timeout: 2s
      lettuce:
        # commons-pool2 is on the classpath; without this block Lettuce shares a single connection
        # for all traffic, which serialises command dispatch under load.
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2s

logging:
  level:
    org:
      springframework:
        web: debug # set to error in staging and production profiles
      hibernate: warn # set to error in staging and production profiles
    web: warn # set to error in staging and production profiles
