# Shared configuration, applied on every profile.
#
# The active profile is written in at build time from the Maven profile, so the two stay in step:
#
#   Maven profile   Spring profile     Configuration file                  Use
#   -------------   ----------------   ---------------------------------   ------------------------
#   default         documan-secrets    application-documan-secrets.yml     gitignored; real secrets
#   dev             dev                application-dev.yml                 the docker compose stack
#   test            test               (supplied by the environment)       CI / staging
#   production      production         (supplied by the environment)       deployment
#
#   mvn spring-boot:run -Pdev        # local, against redis-database.yml
#   mvn spring-boot:run              # default profile; needs the gitignored secrets file
#
# application-documan.yml is the checked-in template for the secrets file, not a profile you run.
# A profile can also be forced at runtime with -Dspring.profiles.active=dev.
spring:
  application:
    name: "documan"
  profiles:
    active:
      "@spring.profiles.active@"

  # This service is almost entirely I/O bound (PostgreSQL, Redis, R2), which is the case virtual
  # threads are built for: a blocked request no longer pins an OS thread. With this on, the useful
  # concurrency limit becomes the connection pools below rather than the servlet thread pool.
  threads:
    virtual:
      enabled: true

  jpa:
    # Sessions must not stay open past the controller. With open-in-view a lazy association could
    # still be initialised during response rendering, which is exactly the hidden N+1 source the
    # entity-graph work is meant to remove.
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      # Previously unset, which left the total request size effectively unbounded.
      max-request-size: 30MB

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false
  tomcat:
    accept-count: 200
    max-connections: 10000
    threads:
      # Request handling runs on virtual threads, so this pool only backs the small amount of
      # work Tomcat still does on platform threads.
      max: 50
      min-spare: 10

documan:
  search:
    # Meilisearch is optional. With this false the client, drainer and /api/v1/search endpoints are
    # not created and the capture layer is a no-op, so the service runs exactly as it did before
    # search existed.
    enabled: true
    host: http://localhost:7700
    api-key: masterKey
    # Index uids are global to a Meilisearch instance, so environments can share one server.
    index-prefix: documan_
    # An unbounded call is how a search outage turns into a thread-pool outage.
    request-timeout: 10s
    reconcile:
      # Marks every indexed row dirty so the index converges on the database even if a change was
      # missed. Only enqueues — the drainer does the pushing, so this costs four set-based inserts
      # regardless of table size, and search keeps serving throughout because documents are
      # upserted rather than cleared and rebuilt.
      enabled: true
      cron: "0 0 */6 * * *"
    outbox:
      batch-size: 200
      poll-interval: 5s
      max-attempts: 8
      # Votes and favourites only move a tally, so they are held briefly and collapsed. A genuine
      # edit arriving meanwhile pulls the entity forward and is not delayed.
      counter-debounce: 60s

