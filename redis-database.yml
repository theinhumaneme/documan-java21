# Local development stack: PostgreSQL, Redis and Meilisearch.
#
# The application itself is not in here — run it from the IDE or with `mvn spring-boot:run -Pdev`,
# which activates src/main/resources/application-dev.yml and points at exactly these services.
#
#   docker compose -f redis-database.yml up -d
#   docker compose -f redis-database.yml ps          # health of each service
#   docker compose -f redis-database.yml down
#
# Credentials here are development defaults and are intentionally checked in. They match
# application-dev.yml; change one and you must change the other.
name: documan-dev

services:
  postgres:
    image: postgres:17.0-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      # Stated explicitly: the application connects to a database called `postgres`, and relying on
      # the image's default (which names it after POSTGRES_USER) makes that look accidental.
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./persist/database/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    tty: true

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - ./persist/redis:/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a password --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    stdin_open: true
    tty: true

  meilisearch:
    image: getmeili/meilisearch:v1.52
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - ./persist/meili:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health | grep -q available"]
      interval: 5s
      timeout: 5s
      retries: 10
